<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报名测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px 35px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 26px;
        }
        .form-item {
            margin-bottom: 22px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 15px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: #fff;
            font-size: 17px;
            cursor: pointer;
            transition: 0.25s;
        }
        button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="formPage">
            <h1>报名测试</h1>
            <div class="form-item">
                <label>手机号</label>
                <input type="tel" id="phone" placeholder="请输入手机号" required>
            </div>
            <div class="form-item">
                <label>手机机型</label>
                <input type="text" id="phoneModel" placeholder="请输入手机机型，例如：一加Ace5 Pro">
            </div>
            <div class="form-item">
                <label>邮箱（可选）</label>
                <input type="email" id="email" placeholder="选填，例如 xxx@qq.com">
            </div>
            <button onclick="submitForm()">提交报名</button>
        </div>
    </div>
    <script>
        const targetUrl = "https://1816791544.share.123pan.cn/123pan/YXhyVv-ru7KH";
        window.onload = function(){
            const hasSigned = localStorage.getItem("isSignedUp");
            if(hasSigned === "true"){
                location.href = targetUrl;
            }
        }
        function submitForm() {
            const phone = document.getElementById('phone').value.trim();
            if (!/^1\d{10}$/.test(phone)) {
                alert("请输入正确的11位手机号");
                return;
            }
            localStorage.setItem("isSignedUp", "true");
            location.href = targetUrl;
        }
    </script>
</body>
</html>
